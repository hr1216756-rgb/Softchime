name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with: { name: softchime-jar, path: build/libs/*.jar }
      - name: Publish release (easy download on phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/softchime-*.jar | grep -v sources | head -1)
          unzip -l "$JAR" | grep -cE "\.ogg" 
          gh release create "v1.0.0-build${{ github.run_number }}" "$JAR" --title "Soft Chime UI build ${{ github.run_number }}" --notes "Fabric mod for Minecraft 26.3. Needs Fabric API. Press K in-game for settings."
      - name: Inspect mouse API (debug)
        if: always()
        run: |
          CP=$(find ~/.gradle -name '*.jar' \( -iname '*minecraft*' -o -iname 'fabric-screen-api*' \) -not -name '*sources*' | tr '\n' ':')
          for c in net.minecraft.client.gui.screens.Screen net.minecraft.client.gui.GuiGraphicsExtractor net.minecraft.client.gui.components.AbstractWidget net.minecraft.client.gui.components.Renderable net.minecraft.client.gui.Font net.minecraft.util.ARGB; do echo "=== $c"; javap -public -cp "$CP" "$c" 2>&1 | head -220; done
