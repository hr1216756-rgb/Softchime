name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build -Pmod_version=1.0.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with: { name: softchime-jar, path: build/libs/*.jar }
      - name: Publish release (easy download on phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/softchime-*.jar | grep -v sources | head -1)
          unzip -l "$JAR" | grep -cE "\.ogg" 
          gh release create "v1.0.${{ github.run_number }}" "$JAR" --title "Soft Chime UI build ${{ github.run_number }}" --notes "Fabric mod for Minecraft 26.3. Needs Fabric API. Press K in-game for settings."
      - name: Inspect API (debug)
        if: always()
        run: |
          CP=$(find ~/.gradle -name '*.jar' \( -iname '*minecraft*' \) -not -name '*sources*' | tr '\n' ':')
          for c in net.minecraft.client.gui.components.events.GuiEventListener net.minecraft.client.gui.Font net.minecraft.client.input.KeyEvent; do echo "=== $c"; javap -public -cp "$CP" "$c" 2>&1 | head -80; done
