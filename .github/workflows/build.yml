name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with: { name: softchime-jar, path: build/libs/*.jar }
      - name: Inspect API (debug)
        if: failure()
        run: |
          find ~/.gradle -name '*.jar' \( -iname '*minecraft*' -o -iname 'fabric-screen-api*' -o -iname 'fabric-key-mapping*' -o -iname 'fabric-lifecycle*' \) -not -name '*sources*' | head -20
          CP=$(find ~/.gradle -name '*.jar' \( -iname '*minecraft*' -o -iname 'fabric-screen-api*' -o -iname 'fabric-key-mapping*' -o -iname 'fabric-lifecycle*' -o -iname 'fabric-api-base*' \) -not -name '*sources*' | tr '\n' ':')
          echo "CP=$CP" | head -c 600
          for c in net.minecraft.client.Minecraft 'com.mojang.blaze3d.platform.InputConstants$Type' net.fabricmc.fabric.api.client.screen.v1.ScreenEvents net.fabricmc.fabric.api.client.screen.v1.Screens 'net.minecraft.client.KeyMapping' 'net.minecraft.client.KeyMapping$Category' net.minecraft.client.gui.GuiGraphicsExtractor net.minecraft.client.MouseHandler net.minecraft.client.gui.components.AbstractWidget net.minecraft.client.gui.screens.Screen net.minecraft.client.resources.sounds.SimpleSoundInstance net.minecraft.client.gui.components.AbstractSliderButton net.minecraft.client.gui.components.Button 'net.minecraft.client.gui.components.Button$Builder'; do echo "=== $c"; javap -public -cp "$CP" "$c" 2>&1 | head -150; done
